name: Build

# Release auf GitHub veröffentlichen → alle Plattformen werden gebaut und die Installer
# automatisch an genau dieses Release angehängt (dauert ca. 15–25 Minuten).
# Manuell gestartet (Actions → Build → Run workflow) wird nur gebaut; die Installer liegen
# dann als Artefakte am Workflow-Lauf.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            artifact: macos-arm64
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            artifact: macos-x64
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux (x64)
            artifact: linux-x64
            platform: ubuntu-22.04
            args: ""
          - name: Linux (ARM64)
            artifact: linux-arm64
            platform: ubuntu-22.04-arm
            args: ""
          - name: Windows (x64)
            artifact: windows-x64
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Release-Tag v1.2.3 → App-Version 1.2.3 (Dateinamen der Installer, Anzeige in der App)
      - name: Version aus dem Release-Tag übernehmen
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(printf '%s' "$TAG" | sed -E 's/^[vV]//' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$VERSION" ]; then
            echo "::error::Der Release-Tag \"$TAG\" muss wie v1.2.3 aussehen."
            exit 1
          fi
          node -e 'const fs=require("fs");const f="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(f,"utf8"));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")' "$VERSION"
          echo "App-Version: $VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.artifact }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SS_TWITCH_CLIENT_ID: ${{ secrets.SS_TWITCH_CLIENT_ID }}
          SS_GOOGLE_CLIENT_ID: ${{ secrets.SS_GOOGLE_CLIENT_ID }}
          SS_GOOGLE_CLIENT_SECRET: ${{ secrets.SS_GOOGLE_CLIENT_SECRET }}
        with:
          # leer bei manuellem Start → nur bauen, nichts hochladen
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}

      - name: Installer als Artefakt bereitstellen (manueller Start)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: StreamSuite-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
