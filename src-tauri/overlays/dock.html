<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamSuite – Multichat</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0a0a0a; --panel: #141414; --border: #262626; --text: #fafafa; --muted: #a3a3a3;
    --twitch: #9146ff; --youtube: #ff0033; --tiktok: #25f4ee; --system: #a3a3a3;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font: 13px/1.4 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; cursor: pointer; user-select: none; color: var(--muted); background: none; font: inherit; }
  .chip.on { color: var(--text); border-color: #404040; }
  .chip svg { width: 12px; height: 12px; }
  .chip .count { font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  #state { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
  #state.ok { background: #22c55e; }
  #list { flex: 1; overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  .msg { display: flex; gap: 6px; padding: 3px 4px; border-radius: 4px; word-break: break-word; }
  .msg:hover { background: #1a1a1a; }
  .msg .icon { flex: none; width: 13px; height: 13px; margin-top: 3px; }
  .msg .icon svg { width: 100%; height: 100%; display: block; }
  .msg time { flex: none; color: #737373; font-size: 11px; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .name { font-weight: 600; margin-right: 4px; }
  .badge { font-size: 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 3px; padding: 0 3px; margin-right: 4px; }
  .ss-emote { height: 20px; vertical-align: middle; margin: -3px 0; }
  .msg.alert { background: color-mix(in srgb, var(--accent) 18%, transparent); border-left: 2px solid var(--accent); }
  .msg.alert b { color: var(--text); }
  .msg.deleted { opacity: .4; text-decoration: line-through; }
  #paused { display: none; position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%); background: #262626; border: 1px solid #404040; color: var(--text); border-radius: 999px; padding: 4px 12px; cursor: pointer; font: inherit; }
  form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); background: var(--panel); }
  select, input, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  input { flex: 1; min-width: 0; }
  button[type=submit] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; cursor: pointer; }
  #toast { position: fixed; top: 44px; right: 8px; background: #7f1d1d; color: #fff; padding: 6px 10px; border-radius: 6px; display: none; max-width: 80%; }
</style>
</head>
<body>
<header>
  <span id="state" title="Verbindung zu StreamSuite"></span>
  <button class="chip on" data-p="twitch"><span style="color:var(--twitch)" class="ic"></span><span class="count" id="v-twitch">–</span></button>
  <button class="chip on" data-p="youtube"><span style="color:var(--youtube)" class="ic"></span><span class="count" id="v-youtube">–</span></button>
  <button class="chip on" data-p="tiktok"><span style="color:var(--tiktok)" class="ic"></span><span class="count" id="v-tiktok">–</span></button>
  <span class="spacer"></span>
  <button class="chip on" id="alerts-toggle">Alerts</button>
</header>
<div id="list"></div>
<button id="paused">Neue Nachrichten ↓</button>
<form id="form">
  <select id="target" title="Senden an">
    <option value="all">Alle</option>
    <option value="twitch">Twitch</option>
    <option value="youtube">YouTube</option>
    <option value="tiktok">TikTok</option>
  </select>
  <input id="input" placeholder="Nachricht senden …" autocomplete="off" maxlength="200">
  <button type="submit">Senden</button>
</form>
<div id="toast"></div>
<script src="/sdk.js"></script>
<script>
  const S = StreamSuite, H = S.helpers;
  const list = document.getElementById("list");
  const pausedBtn = document.getElementById("paused");
  const filters = { twitch: true, youtube: true, tiktok: true, alerts: true };
  const MAX = 500;

  document.querySelectorAll(".chip[data-p]").forEach((chip) => {
    chip.querySelector(".ic").innerHTML = H.platformIcon(chip.dataset.p);
    chip.onclick = () => { filters[chip.dataset.p] = !filters[chip.dataset.p]; chip.classList.toggle("on"); applyFilter(); };
  });
  document.getElementById("alerts-toggle").onclick = (e) => { filters.alerts = !filters.alerts; e.currentTarget.classList.toggle("on"); applyFilter(); };

  function visible(el) { return el.dataset.kind === "alert" ? filters.alerts : filters[el.dataset.p] !== false; }
  function applyFilter() { for (const el of list.children) el.style.display = visible(el) ? "" : "none"; scrollDown(true); }

  function atBottom() { return list.scrollHeight - list.scrollTop - list.clientHeight < 40; }
  function scrollDown(force) {
    if (force || atBottom()) { list.scrollTop = list.scrollHeight; pausedBtn.style.display = "none"; }
    else pausedBtn.style.display = "block";
  }
  list.addEventListener("scroll", () => { if (atBottom()) pausedBtn.style.display = "none"; });
  pausedBtn.onclick = () => scrollDown(true);

  const time = (ts) => new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const BADGE = { broadcaster: "Streamer", owner: "Streamer", moderator: "Mod", vip: "VIP", subscriber: "Sub", member: "Mitglied", founder: "Founder" };

  function add(ev) {
    const stick = atBottom();
    const el = document.createElement("div");
    const isAlert = ev.category === "alert";
    el.className = "msg" + (isAlert ? " alert" : "");
    el.dataset.p = ev.platform;
    el.dataset.kind = isAlert ? "alert" : "chat";
    el.dataset.id = (ev.data && ev.data.message_id) || ev.id;
    el.style.setProperty("--accent", H.platformColor(ev.platform));
    let html = `<time>${time(ev.timestamp)}</time><span class="icon" style="color:${H.platformColor(ev.platform)}">${H.platformIcon(ev.platform)}</span><span>`;
    if (isAlert) {
      const a = H.formatAlert(ev);
      html += `<b>${H.escapeHtml(a.title)}</b> · ${H.escapeHtml(a.text)}${a.message ? ` <i>${H.escapeHtml(a.message)}</i>` : ""}`;
    } else {
      const u = ev.user || {};
      const badges = (u.badges || []).map((b) => BADGE[b]).filter(Boolean).map((b) => `<span class="badge">${b}</span>`).join("");
      const color = u.color || H.platformColor(ev.platform);
      html += `${badges}<span class="name" style="color:${H.escapeHtml(color)}">${H.escapeHtml(u.display_name || u.name)}</span>${H.renderMessage(ev)}`;
    }
    el.innerHTML = html + "</span>";
    if (!visible(el)) el.style.display = "none";
    list.appendChild(el);
    while (list.children.length > MAX) list.firstElementChild.remove();
    if (stick) scrollDown(true); else pausedBtn.style.display = "block";
  }

  const ss = S.connect();
  const state = document.getElementById("state");
  ss.on("connected", () => state.classList.add("ok"));
  ss.on("disconnected", () => state.classList.remove("ok"));
  ss.on("history", (h) => {
    state.classList.add("ok");
    list.innerHTML = "";
    [...h.chat.filter((e) => e.type === "chat"), ...h.alerts].sort((a, b) => a.timestamp - b.timestamp).forEach(add);
    scrollDown(true);
  });
  ss.on("chat", (ev) => { if (ev.type === "chat") add(ev); });
  ss.on("alert", add);
  ss.on("delete", (ev) => {
    const el = list.querySelector(`[data-id="${CSS.escape(ev.data.message_id || "")}"]`);
    if (el) el.classList.add("deleted");
  });
  ss.on("stats", (st) => {
    for (const p of ["twitch", "youtube", "tiktok"]) {
      const v = st && st.platforms && st.platforms[p] && st.platforms[p].viewers;
      document.getElementById("v-" + p).textContent = v == null ? "–" : v.toLocaleString("de-DE");
    }
  });

  const toast = document.getElementById("toast");
  function showError(msg) { toast.textContent = msg; toast.style.display = "block"; setTimeout(() => (toast.style.display = "none"), 4000); }

  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    try {
      const res = await ss.sendChat(text, document.getElementById("target").value);
      const errors = Object.entries(res).filter(([, r]) => !r.ok).map(([p, r]) => `${H.platformName(p)}: ${r.error}`);
      if (Object.keys(res).length === 0) showError("Keine verbundene Plattform zum Senden");
      else if (errors.length) showError(errors.join("\n"));
    } catch (err) { showError("Senden fehlgeschlagen"); }
  };
</script>
</body>
</html>
